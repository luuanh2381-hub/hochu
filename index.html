<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学中文 · Học Tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/conversation-v155.css">
<link rel="stylesheet" href="/css/design-guofeng.css">
<script src="/js/resilience.js"></script>
</head>
<body>

<div id="auth-gate">
  <div class="auth-box">
    <div class="gf-auth-emblem" aria-hidden="true">
      <span class="gf-seal gf-seal-lg">学</span>
    </div>
    <div class="auth-title">学中文</div>
    <div class="auth-sub">Đăng nhập để lưu tiến độ học riêng của bạn</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="auth-tab-login" onclick="authSwitchTab('login')">Đăng nhập</button>
      <button class="auth-tab" id="auth-tab-register" onclick="authSwitchTab('register')">Đăng ký</button>
    </div>
    <div class="auth-note" id="auth-note"></div>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-field">
      <label>Tên đăng nhập</label>
      <input type="text" id="auth-username" autocomplete="username" placeholder="vd: minh123">
    </div>
    <div class="auth-field">
      <label>Mật khẩu</label>
      <input type="password" id="auth-password" autocomplete="current-password" placeholder="••••••">
    </div>
    <button class="auth-submit" id="auth-submit" onclick="authSubmit()">Đăng nhập</button>
  </div>
</div>

<div id="account-menu" class="duo-modal-backdrop" style="display:none;">
  <div class="auth-box" style="max-width:340px;">
    <div class="auth-title" id="account-menu-name">👤</div>
    <button class="auth-submit duo-btn-blue" style="margin-top:12px" onclick="closeAccountMenu(); openChangePassword();">🔑 Đổi mật khẩu</button>
    <button class="auth-submit duo-btn-purple" style="margin-top:10px" onclick="closeAccountMenu(); openOptimizerModal();">🧠 FSRS Optimizer</button>
    <button class="auth-submit duo-btn-orange" style="margin-top:10px" onclick="openDangerConfirm('fsrs-reset')">🔄 Reset FSRS</button>
    <button class="auth-submit duo-btn-red" style="margin-top:10px" onclick="openDangerConfirm('wipe-data')">🗑️ Xoá toàn bộ dữ liệu học tập</button>
    <button class="auth-submit duo-btn-red" style="margin-top:10px" onclick="closeAccountMenu(); if(confirm('Đăng xuất khỏi tài khoản này?')) authLogout();">🚪 Đăng xuất</button>
    <button class="auth-guest" onclick="closeAccountMenu()">Đóng</button>
  </div>
</div>

<!-- V76 (Yêu cầu 6/7/9): modal xác nhận DÙNG CHUNG cho cả "Reset FSRS" và "Xoá toàn bộ dữ liệu học
     tập" — nội dung/màu nút đổi động theo hành động qua openDangerConfirm(kind) (xem js/settings.js),
     tránh lặp lại gần như y hệt 1 khối modal 2 lần. Bắt buộc gõ đúng chữ RESET mới cho xác nhận. -->
<div id="danger-confirm-modal" class="duo-modal-backdrop z-top" style="display:none;">
  <div class="auth-box" style="max-width:350px;">
    <div class="auth-title" id="danger-confirm-title">⚠️</div>
    <div style="color:var(--muted);font-size:.82rem;text-align:center;margin-bottom:10px;line-height:1.5;" id="danger-confirm-desc"></div>
    <div style="font-weight:800;font-size:.85rem;text-align:center;margin-bottom:12px;white-space:pre-line;color:var(--ink);" id="danger-confirm-question"></div>
    <div class="auth-error" id="danger-confirm-error"></div>
    <div class="auth-field">
      <label>Gõ "RESET" (viết hoa) để xác nhận</label>
      <input type="text" id="danger-confirm-input" autocomplete="off" placeholder="RESET">
    </div>
    <button class="auth-submit duo-btn-red" id="danger-confirm-submit" onclick="submitDangerConfirm()">Xác nhận</button>
    <button class="auth-guest" onclick="closeDangerConfirm()">Huỷ</button>
  </div>
</div>

<!-- V82 (FSRS Personal Optimizer) — modal tự phục vụ: audit dữ liệu → chạy optimizer → so sánh
     default/personal → Apply/Rollback/Reset. Toàn bộ logic ở js/fsrs-optimizer.js. Rộng hơn các
     modal khác (440px) vì cần hiện lưới KPI + bảng so sánh, nhưng vẫn dùng LẠI đúng các class sẵn
     có (.dash-kpi*, .btn, .auth-*) — không cần dashboard riêng (đúng yêu cầu "không cần phức tạp"). -->
<div id="optimizer-modal" class="duo-modal-backdrop z-top" style="display:none;">
  <div class="auth-box" style="max-width:460px;max-height:88vh;overflow-y:auto;">
    <div class="auth-title">🧠 FSRS Optimizer</div>
    <div style="color:var(--muted);font-size:.8rem;text-align:center;margin-bottom:14px;line-height:1.5;">
      Tìm bộ tham số ghi nhớ (weights) RIÊNG cho bạn, dựa trên lịch sử ôn tập thật — thay vì dùng bộ mặc định chung cho mọi người.
    </div>
    <div id="optimizer-body">
      <div class="study-empty">⏳ Đang tải...</div>
    </div>
    <button class="auth-guest" onclick="closeOptimizerModal()">Đóng</button>
  </div>
</div>


<div id="pw-modal" class="duo-modal-backdrop" style="display:none;">
  <div class="auth-box" style="max-width:340px;">
    <div class="auth-title">🔑 Đổi mật khẩu</div>
    <div class="auth-error" id="pw-error"></div>
    <div class="auth-field">
      <label>Mật khẩu hiện tại</label>
      <input type="password" id="pw-old" autocomplete="current-password" placeholder="••••••">
    </div>
    <div class="auth-field">
      <label>Mật khẩu mới</label>
      <input type="password" id="pw-new" autocomplete="new-password" placeholder="Tối thiểu 4 ký tự">
    </div>
    <div class="auth-field">
      <label>Nhập lại mật khẩu mới</label>
      <input type="password" id="pw-new2" autocomplete="new-password" placeholder="••••••">
    </div>
    <button class="auth-submit" id="pw-submit" onclick="submitChangePassword()">Đổi mật khẩu</button>
    <button class="auth-guest" onclick="closeChangePassword()">Huỷ</button>
  </div>
</div>

<div id="app-header">
<div id="topbar">
  <h1><span class="gf-seal gf-seal-sm" aria-hidden="true">学</span><span class="brand-text">学中文</span></h1>
  <span id="streak-badge" title="Số ngày học liên tiếp">🔥 0</span>
  <span id="study-timer-chip" style="display:none;background:var(--active-c,#e0e7ff);padding:3px 9px;border-radius:16px;font-size:.7rem;font-weight:800;color:var(--active-dark,#3730a3);"></span>
  <button id="user-badge" onclick="authOpenMenu()">👤</button>
  <button id="display-btn" class="display-btn" onclick="navToggleDisplay()" aria-label="Hiển thị" aria-expanded="false" title="Hiển thị">⚙️<i id="display-dot"></i></button>
</div>
<!-- V116: các nút giao diện gom vào 1 bảng (giữ nguyên id để code cũ cập nhật nhãn như trước) -->
<div id="display-panel" style="display:none;">
  <div class="dp-section-lbl">Hiển thị thẻ &amp; Giao diện</div>
  <div class="dp-row">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn" title="Chế độ tối/sáng">🌙</button>
    <button class="pinyin-toggle" onclick="togglePinyin()" id="py-toggle-btn">Ẩn Pinyin</button>
    <button class="pinyin-toggle" onclick="toggleMeaning()" id="vi-toggle-btn">Ẩn nghĩa</button>
    <button class="pinyin-toggle" onclick="toggleHanViet()" id="hv-toggle-btn">Ẩn Hán Việt</button>
  </div>
  <div class="dp-section-lbl">Giọng đọc tiếng Trung</div>
  <div class="dp-row">
    <div class="speed-control">
      <label>🐢 Tốc độ</label>
      <input type="range" id="speed-slider" min="0.8" max="1.2" step="0.1" value="0.9" oninput="updateSpeed(this.value)">
      <span class="speed-val" id="speed-val">0.90</span>
    </div>
    <div class="speed-control">
      <label for="tts-voice">🎙️ Giọng</label>
      <select id="tts-voice" onchange="updateTtsVoice(this.value)" style="max-width:190px;padding:6px;border-radius:10px;">
        <option value="zh-CN-XiaoxiaoNeural">Nữ · Xiaoxiao</option>
        <option value="zh-CN-YunxiNeural">Nam · Yunxi</option>
      </select>
    </div>
  </div>
  <div class="dp-row" style="gap:6px;flex-wrap:wrap;">
    <button class="pinyin-toggle" type="button" onclick="testTtsVoice('zh-CN-XiaoxiaoNeural')">🎧 Thử Xiaoxiao</button>
    <button class="pinyin-toggle" type="button" onclick="testTtsVoice('zh-CN-YunxiNeural')">🎧 Thử Yunxi</button>
    <span id="tts-status" style="font-size:.75rem;opacity:.85"></span>
  </div>
  <div class="dp-row" style="gap:6px;flex-wrap:wrap;">
    <button class="pinyin-toggle" type="button" onclick="pauseSpeaking()">⏸ Tạm dừng đọc</button>
    <button class="pinyin-toggle" type="button" onclick="resumeSpeaking()">▶ Tiếp tục đọc</button>
    <button class="pinyin-toggle" type="button" onclick="stopSpeaking()">⏹ Dừng đọc</button>
  </div>
</div>
</div>

<div id="subnav" style="display:none;"></div>

<div id="content"></div>

<!-- V116: bảng "Thêm" (mở từ nút ⋯ ở thanh dưới). id tab-admin / tab-vocab giữ nguyên để auth.js bật/tắt theo quyền. -->
<div id="more-sheet" style="display:none;">
  <button onclick="goTab('compare')" id="tab-compare">🆚 So sánh</button>
  <button onclick="goTab('convo')" id="tab-convo">🗣️ Hội thoại</button>
  <button onclick="goTab('listening')" id="tab-listening">🎧 Luyện nghe</button>
  <button onclick="goTab('aibank')" id="tab-aibank" style="display:none;">🤖 Thư viện AI</button>
  <button onclick="goTab('ttsfix')" id="tab-ttsfix" style="display:none;">🔧 Sửa phát âm</button>
  <button onclick="goTab('admin')" id="tab-admin" style="display:none;">🛠️ Quản trị</button>
  <button onclick="goTab('vocab')" id="tab-vocab" style="display:none;">📚 Từ vựng</button>
</div>
