<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge-TTS Lab · HSK</title>
<style>
  :root { --paper:#fff; --ink:#1f2937; --muted:#6b7280; --border:#e5e7eb; --brand:#2563eb; --ok:#047857; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --paper:#111827; --ink:#f3f4f6; --muted:#9ca3af; --border:#374151; --brand:#60a5fa; --ok:#34d399; --err:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:20px; }
  .card { border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:.9rem; margin-bottom:6px; }
  textarea { width:100%; min-height:110px; resize:vertical; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--paper); color:var(--ink); font:inherit; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  select { font:inherit; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--paper); color:var(--ink); }
  .counter { margin-left:auto; font-size:.8rem; color:var(--muted); }
  .samples { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button { font:inherit; padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--paper); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { min-height:1.4em; font-size:.9rem; margin-top:10px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .audio-card { border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:12px; }
  .audio-card h3 { margin:0 0 2px; font-size:1rem; }
  .meta { color:var(--muted); font-size:.82rem; margin-bottom:8px; }
  audio { width:100%; margin-top:6px; }
  .hint { font-size:.78rem; color:var(--muted); margin-top:6px; }
  .compare { margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>🧪 Edge-TTS Lab</h1>
  <div class="sub">Thử nghiệm độc lập · chỉ 2 giọng phổ thông Trung Quốc đại lục · tối đa 500 ký tự · không tự phát khi mở trang</div>

  <div class="card">
    <label for="text">Câu tiếng Trung</label>
    <textarea id="text" maxlength="500" placeholder="Nhập câu tiếng Trung (giản thể hoặc phồn thể)…"></textarea>
    <div class="row">
      <span class="counter"><span id="count">0</span>/500</span>
    </div>
    <div class="samples" id="samples"></div>
    <div class="row">
      <button id="clear" type="button">Xóa nội dung</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label for="voice">Giọng đọc</label>
        <select id="voice">
          <option value="zh-CN-XiaoxiaoNeural" selected>Nữ · Xiaoxiao (mặc định)</option>
          <option value="zh-CN-YunxiNeural">Nam · Yunxi</option>
        </select>
      </div>
      <div>
        <label for="rate">Tốc độ</label>
        <select id="rate">
          <option value="0.8">0.8x</option>
          <option value="0.9" selected>0.9x (mặc định)</option>
          <option value="1.0">1.0x</option>
          <option value="1.1">1.1x</option>
          <option value="1.2">1.2x</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button id="generate" class="primary" type="button">Tạo âm thanh</button>
      <button id="play" type="button" disabled>Phát</button>
      <button id="pause" type="button" disabled>Tạm dừng</button>
      <button id="replay" type="button" disabled>Nghe lại</button>
      <button id="stop" type="button" disabled>Dừng</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="single"></div>
    <div class="compare">
      <button id="compare" type="button">So sánh hai giọng (cùng câu, cùng tốc độ)</button>
      <div class="hint">Tạo lần lượt 2 bản MP3 để nghe đối chiếu; không tự phát.</div>
      <div id="compareOut"></div>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var SAMPLES = [
    '你好，很高兴认识你。',
    '我每天早上七点起床。',
    '因为今天下雨，所以我没有出去。',
    '你觉得这个问题应该怎么解决？',
    '我想在台湾找一份合适的工作。'
  ];
  var VOICE_LABEL = { 'zh-CN-XiaoxiaoNeural': 'Nữ · Xiaoxiao', 'zh-CN-YunxiNeural': 'Nam · Yunxi' };
  var VOICE_GENDER = { 'zh-CN-XiaoxiaoNeural': 'Nữ', 'zh-CN-YunxiNeural': 'Nam' };
  var textEl = document.getElementById('text');
  var countEl = document.getElementById('count');
  var statusEl = document.getElementById('status');
  var singleEl = document.getElementById('single');
  var compareOut = document.getElementById('compareOut');
  var generateBtn = document.getElementById('generate');
  var compareBtn = document.getElementById('compare');
  var controls = ['play', 'pause', 'replay', 'stop'].map(function (id) { return document.getElementById(id); });
  var current = null;   // { url, audio, meta }
  var active = null;    // audio đang phát gần nhất (để chặn phát chồng)

  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }
  function updateCount() { countEl.textContent = String([...textEl.value].length); }
  textEl.addEventListener('input', updateCount);

  SAMPLES.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.length > 14 ? s.slice(0, 13) + '…' : s;
    b.title = s;
    b.addEventListener('click', function () { textEl.value = s; updateCount(); textEl.focus(); });
    document.getElementById('samples').appendChild(b);
  });

  document.getElementById('clear').addEventListener('click', function () {
    textEl.value = ''; updateCount(); textEl.focus(); setStatus('');
  });

  function stopAll() {
    document.querySelectorAll('audio').forEach(function (a) { try { a.pause(); } catch (e) {} });
  }
  function wireAudio(audio, meta) {
    audio.addEventListener('play', function () { if (active && active !== audio) { try { active.pause(); } catch (e) {} } active = audio; });
    return audio;
  }
  function disableControls(off) { controls.forEach(function (b) { b.disabled = off; }); }

  function cardHtml(meta) {
    return '<div class="audio-card"><h3>' + meta.label + '</h3>' +
      '<div class="meta">Giới tính: ' + meta.gender + ' · Tốc độ: ' + meta.rate + 'x · MP3</div>' +
      '<div class="player"></div></div>';
  }

  function requestTts(text, voice, rate) {
    return fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, voice: voice, rate: rate })
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (d) {
          throw new Error((d && d.error) || ('Lỗi ' + res.status));
        });
      }
      return res.blob();
    });
  }

  generateBtn.addEventListener('click', function () {
    var text = textEl.value.trim();
    var voice = document.getElementById('voice').value;
    var rate = document.getElementById('rate').value;
    if (!text) { setStatus('Nhập câu tiếng Trung trước.', 'err'); return; }
    if ([...text].length > 500) { setStatus('Tối đa 500 ký tự.', 'err'); return; }
    if (current && current.url) URL.revokeObjectURL(current.url);
    current = null; singleEl.innerHTML = ''; disableControls(true); generateBtn.disabled = true;
    setStatus('Đang tạo âm thanh…');
    var t0 = performance.now();
    requestTts(text, voice, rate).then(function (blob) {
      var ms = Math.round(performance.now() - t0);
      var url = URL.createObjectURL(blob);
      var audio = wireAudio(new Audio(url), null);
      audio.preload = 'auto';
      current = { url: url, audio: audio, meta: { voice: voice, label: VOICE_LABEL[voice], gender: VOICE_GENDER[voice], rate: rate } };
      singleEl.innerHTML = cardHtml(current.meta);
      singleEl.querySelector('.player').appendChild(audio);
      setStatus('Tạo xong (MP3 ' + Math.max(1, Math.round(blob.size / 1024)) + ' KB · ' + ms + ' ms). Bấm Phát để nghe.', 'ok');
      controls.forEach(function (b) { b.disabled = false; });
    }).catch(function (err) {
      setStatus('Lỗi: ' + err.message, 'err');
      controls.forEach(function (b) { b.disabled = true; });
    }).then(function () { generateBtn.disabled = false; });
  });

  document.getElementById('play').addEventListener('click', function () {
    if (!current) return;
    stopAll();
    current.audio.play().catch(function (e) { setStatus('Không phát được: ' + e.message, 'err'); });
  });
  document.getElementById('pause').addEventListener('click', function () { if (current) current.audio.pause(); });
  document.getElementById('replay').addEventListener('click', function () {
    if (!current) return;
    stopAll(); current.audio.currentTime = 0;
    current.audio.play().catch(function (e) { setStatus('Không phát lại được: ' + e.message, 'err'); });
  });
  document.getElementById('stop').addEventListener('click', function () {
    if (!current) return;
    current.audio.pause(); current.audio.currentTime = 0;
  });

  compareBtn.addEventListener('click', function () {
    var text = textEl.value.trim();
    var rate = document.getElementById('rate').value;
    if (!text) { setStatus('Nhập câu tiếng Trung trước.', 'err'); return; }
    if ([...text].length > 500) { setStatus('Tối đa 500 ký tự.', 'err'); return; }
    stopAll(); compareOut.innerHTML = ''; compareBtn.disabled = true; generateBtn.disabled = true;
    setStatus('Đang tạo 2 bản so sánh…');
    var voices = ['zh-CN-XiaoxiaoNeural', 'zh-CN-YunxiNeural'];
    var t0 = performance.now();
    voices.reduce(function (chain, voice) {
      return chain.then(function () {
        return requestTts(text, voice, rate).then(function (blob) {
          var url = URL.createObjectURL(blob);
          var meta = { voice: voice, label: VOICE_LABEL[voice], gender: VOICE_GENDER[voice], rate: rate };
          var box = document.createElement('div');
          box.innerHTML = cardHtml(meta);
          var audio = wireAudio(new Audio(url), meta);
          audio.preload = 'auto';
          box.querySelector('.player').appendChild(audio);
          var play = document.createElement('button');
          play.type = 'button'; play.textContent = 'Phát';
          play.addEventListener('click', function () { stopAll(); audio.currentTime = 0; audio.play().catch(function (e) { setStatus('Không phát được: ' + e.message, 'err'); }); });
          box.querySelector('.player').appendChild(play);
          compareOut.appendChild(box);
          box.__url = url;
        });
      });
    }, Promise.resolve()).then(function () {
      var ms = Math.round(performance.now() - t0);
      setStatus('Đã tạo 2 bản so sánh (' + ms + ' ms). Bấm Phát ở từng thẻ để nghe lần lượt.', 'ok');
    }).catch(function (err) {
      setStatus('Lỗi khi so sánh: ' + err.message, 'err');
    }).then(function () { compareBtn.disabled = false; generateBtn.disabled = false; });
  });

  // Dọn URL cũ khi rời trang.
  window.addEventListener('beforeunload', function () {
    if (current && current.url) URL.revokeObjectURL(current.url);
    compareOut.querySelectorAll('.audio-card').forEach(function (box) { if (box.__url) URL.revokeObjectURL(box.__url); });
  });

  updateCount();
})();
</script>
</body>
</html>
